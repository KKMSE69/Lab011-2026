name: Playwright Shade Tests 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    #workflow_dispatch:
    #schedule:
    #  - cron: '0 2 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shardIndex: [1,2,3,4]
        shardTotal: [4]
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v3
          with:
            node-version: lts/*
            cache: 'npm'
          name: Install Dependencies
          run: npm ci
        - name: Run Playwright Browsers
          run: npx playwright install --with-deps
        - name: Upload the HTML report
          if: ${{!cancelled()}}
          uses: actions/upload-artifact@v4
          with:
            name: blob-report-${{ matrix.shardIndex }}
            path: blob-report
            retenetion-days: 1
merge-reports:
  if: ${{!cancelled()}}
  needs: test
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install Dependencies
      run: npm ci
    - name: Download the blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        name: blob-report-*
    - name: Merge the blob reports
      run: npx playwright merge-reports all-blob-reports --reporter html ./all-blob-reports
    - name: Upload the merged HTML report
      uses: actions/upload-artifact@v4
      with:
        name: html-report-attempt-${{github.run_attempt}}
        path: playwright-reports
        retention-days: 14